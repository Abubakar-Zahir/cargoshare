[project]
name = "cargoshare-backend"
version = "0.1.0"
description = "CargoShare API"
requires-python = "==3.14.*"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi[standard]==0.143.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false
exclude-newer = "24 hours"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "ASYNC", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
